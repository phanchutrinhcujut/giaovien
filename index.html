<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GIÁO VIÊN THPT PHAN CHU TRINH CƯJUT</title>
  <link rel="icon" href="https://ssl.gstatic.com/docs/spreadsheets/forms/favicon_qp2.png" type="image/x-icon">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    /* 
      KỸ THUẬT TRIỆT TIÊU HOÀN TOÀN THANH CẢNH BÁO GOOGLE APPS SCRIPT:
      Thanh banner của Google có chiều cao chuẩn là 40px - 42px.
      Ta đặt top: -42px và tăng height thêm 42px để đẩy thanh này ra khỏi mép màn hình.
    */
    #appFrame {
      position: absolute;
      top: -42px;
      left: 0;
      width: 100%;
      height: calc(100% + 42px);
      border: none;
      display: block;
    }
    /* Màn hình tải ban đầu */
    #loadingCover {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Màn hình chờ thẩm mỹ -->
  <div id="loadingCover">
    <div class="spinner"></div>
    <p style="margin-top: 14px; color: #475569; font-size: 14px; font-weight: 600;">Đang kết nối hệ thống ...</p>
  </div>

  <!-- 
    HÃY THAY ĐƯỜNG LINK WEB APP CỦA BẠN VÀO THUỘC TÍNH src DƯỚI ĐÂY:
    (Đường link kết thúc bằng /exec)
  -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwXqUwHwXiapFV8QeMtQTbmc8B56ca7VfyjaNXR7JEj90PZuCulwEZulaLJvZnhQFz9XA/exec" 
    allow="clipboard-write; fullscreen"
    onload="document.getElementById('loadingCover').style.opacity='0'; setTimeout(()=>document.getElementById('loadingCover').style.display='none', 400);">
  </iframe>

</body>
</html>
